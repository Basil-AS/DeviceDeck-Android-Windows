# Checks the locales, runs the Android unit tests and lint, builds the release APK and AAB, runs the core and desktop
# tests and builds the desktop files (scripts/desktop-dist.sh). Tag pushes publish signed Android or desktop releases.
# On the PC, scripts/release-build.sh builds the same files. Release-only signing secrets are exposed only to
# android-v* tags, never to pull requests. Build artifacts are checksummed before publication.
name: Build

# The run reads the repository only. The signing key arrives as a secret, so no write scope is needed.
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    tags: ["android-v*", "desktop-v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      appimage_only:
        description: Build the Linux AppImage only (`gh workflow run Build -f appimage_only=true`)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: ${{ !inputs.appimage_only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          PROPS: ${{ secrets.RELEASE_KEY_PROPERTIES }}
        if: startsWith(github.ref, 'refs/tags/android-v') && env.KEYSTORE != ''
        run: |
          mkdir -p local/keys
          echo "$KEYSTORE" | base64 -d > local/keys/quickbuds-release.jks
          printf '%s\n' "$PROPS" > local/keys/keystore.properties
      - name: Require the persistent signer for Android releases
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          PROPS: ${{ secrets.RELEASE_KEY_PROPERTIES }}
        run: test -n "$KEYSTORE" && test -n "$PROPS"
      - name: Every string in all locales
        run: python3 scripts/check-locales.py
      - name: Unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug
      - run: ./gradlew assembleRelease bundleRelease
      - name: Release names
        run: |
          ver=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          apk=$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)
          aab=$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)
          test -n "$ver" && test -n "$apk" && test -n "$aab"
          if [[ "$GITHUB_REF_NAME" == android-v* ]]; then
            test "${GITHUB_REF_NAME#android-v}" = "$ver"
            apksigner_path="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
            test -n "$apksigner_path"
            "$apksigner_path" verify --verbose "$apk"
          fi
          mkdir out
          cp "$apk" "out/DeviceDeck-Android-$ver.apk"
          cp "$aab" "out/DeviceDeck-Android-$ver.aab"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android
          path: out/*
          retention-days: 14

  desktop:
    runs-on: ubuntu-24.04
    # Ubuntu 24.04 (glibc 2.39): its WebKitGTK renders the transparent window cleanly. The 22.04 one ghosts.
    container: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Packages
        run: |
          apt-get update -qq
          apt-get install -y -qq curl wget git zip python3 build-essential pkg-config file dpkg-dev patchelf xz-utils \
            clang lld llvm libssl-dev libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-layer-shell-dev \
            libayatana-appindicator3-dev librsvg2-dev libxkbcommon-x11-0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal --target x86_64-pc-windows-msvc
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo install tauri-cli --version "^2" --locked
          cargo install cargo-xwin --locked
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            desktop-tauri -> target
            core -> target
      - name: Test
        if: ${{ !inputs.appimage_only }}
        run: |
          cd core && cargo test
          cd ../desktop-tauri && cargo test
      - name: Archives
        env:
          QB_APPIMAGE_ONLY: ${{ inputs.appimage_only && '1' || '' }}
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' desktop-tauri/Cargo.toml | head -1)
          QB_NATIVE=1 scripts/desktop-dist.sh "$ver"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop
          path: desktop-tauri/dist/*
          retention-days: 14

  checksums:
    # One SHA256SUMS for the whole release: the updater and the Linux installer verify against it.
    needs: [android, desktop]
    if: ${{ always() && needs.desktop.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: files
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd files
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: checksums
          path: files/SHA256SUMS
          retention-days: 14

  release:
    needs: [android, desktop, checksums]
    if: startsWith(github.ref, 'refs/tags/android-v') || startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Require a commit merged to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: artifacts
          merge-multiple: true
      - name: Select and validate release assets
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          mkdir release-files
          if [[ "$tag" == android-v* ]]; then
            version="${tag#android-v}"
            declared="$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
            test "$version" = "$declared"
            cp "artifacts/DeviceDeck-Android-$version.apk" release-files/
            cp "artifacts/DeviceDeck-Android-$version.aab" release-files/
          else
            version="${tag#desktop-v}"
            declared="$(sed -n 's/^version = "\(.*\)"/\1/p' desktop-tauri/Cargo.toml | head -1)"
            test "$version" = "$declared"
            cp artifacts/DeviceDeck*-windows-x64.zip release-files/
            cp artifacts/DeviceDeck-linux-x64.AppImage release-files/
          fi
          : > release-files/SHA256SUMS
          while IFS= read -r file; do
            grep -F "  $file" artifacts/SHA256SUMS >> release-files/SHA256SUMS
          done < <(find release-files -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n')
          (cd release-files && sha256sum -c SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#*-v}"
          if [[ "$version" =~ (alpha|beta|rc) ]]; then
            gh release create "$GITHUB_REF_NAME" release-files/* --verify-tag --prerelease --latest=false --title "DeviceDeck $version" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" release-files/* --verify-tag --latest --title "DeviceDeck $version" --generate-notes
          fi
